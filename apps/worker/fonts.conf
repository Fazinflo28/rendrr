<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Graphics browser (worker image): common font names in graphics code, mapped to the open fonts installed here.
     Arimo, Tinos, Cousine, Gelasio and Carlito are metric-compatible with the fonts they stand in for. -->
<fontconfig>
  <alias binding="same"><family>Arial</family><prefer><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Tinos</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Tinos</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Cousine</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Cousine</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Impact</family><prefer><family>Anton</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Open Sans Condensed</family><prefer><family>Open Sans</family></prefer></alias>
</fontconfig>
