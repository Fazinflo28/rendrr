<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendrr projects</title>
<style>
/* Rendrr in the chat: every edit, each one's latest preview, its comments. One file, no network of its own: the
   preview and thumbnails are signed storage links, data comes through the host from Rendrr's MCP server. */
:root {
  --bg: var(--color-background-primary, #0f1113); --panel: var(--color-background-secondary, #16181b); --surface: var(--color-background-tertiary, #1e2024);
  --ink: var(--color-text-primary, #f7f7f8); --muted: var(--color-text-secondary, #9a9b9d); --faint: var(--color-text-tertiary, #6c6e71);
  --line: var(--color-border-primary, rgba(255,255,255,.1)); --hair: var(--color-border-secondary, rgba(255,255,255,.06));
  --accent: #bde816; --accent-ink: #bde816; --on-accent: #1a1a1a; --accent-soft: rgba(189,232,22,.12);
  --danger: var(--color-text-danger, #ff6b6b); --warn: #f5b84a;
  --r-sm: var(--border-radius-sm, 8px); --r-md: var(--border-radius-md, 12px); --r-lg: var(--border-radius-lg, 16px);
  --font: var(--font-sans, Inter, system-ui, -apple-system, "Segoe UI", sans-serif);
  --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
}
html[data-theme="light"] {
  --bg: var(--color-background-primary, #ffffff); --panel: var(--color-background-secondary, #f6f6f4); --surface: var(--color-background-tertiary, #eeeeea);
  --ink: var(--color-text-primary, #17181a); --muted: var(--color-text-secondary, #5d5f63); --faint: var(--color-text-tertiary, #8b8d91);
  --line: var(--color-border-primary, rgba(0,0,0,.12)); --hair: var(--color-border-secondary, rgba(0,0,0,.07));
  --accent: #bde816; --accent-ink: #4f6600; --on-accent: #1a1a1a; --accent-soft: rgba(120,160,0,.12);
  --danger: var(--color-text-danger, #c92a2a); --warn: #a86a00;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { padding: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 6px 11px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--panel); }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; }
.brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: inline-block; }
h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.top { margin-bottom: 12px; flex-wrap: wrap; }
.search { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 6px 10px; color: var(--ink); min-width: 160px; width: 220px; max-width: 100%; }
.search:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* All projects */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1px solid var(--hair); background: var(--panel); border-radius: var(--r-md); padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.card:hover { border-color: var(--line); }
.card:focus-visible { outline: 2px solid var(--accent); }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface) center / cover no-repeat; }
.thumb .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 6px; }
.thumb .shape { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 6px; }
.card .body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface); color: var(--muted); }
.chip.ok { background: var(--accent-soft); color: var(--accent-ink); }
.chip.warn { color: var(--warn); }
.empty { padding: 36px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-md); }
.more { margin: 12px auto 0; display: flex; }

/* One project */
/* One edit, top to bottom: the player, the comments, the box to write one. Full screen it fills the host's panel:
   the player on top, the comments scroll in the middle, the box stays at the bottom. */
.pv { display: flex; flex-direction: column; gap: 10px; }
.pv .side { display: flex; flex-direction: column; gap: 10px; }
html.fs, html.fs body { height: 100%; }
html.fs body { padding: 14px 18px; overflow: hidden; }
html.fs #root { height: 100%; overflow: auto; }
html.fs .pv { height: 100%; }
html.fs .pv .side { flex: 1; min-height: 0; }
html.fs .pv .side > .list, html.fs .pv .side > .empty { flex: 1; min-height: 0; max-height: none; }
.pv .top { margin-bottom: 0; }
.stage { background: #000; border-radius: var(--r-md); overflow: hidden; display: flex; justify-content: center; align-items: center; }
/* Inline, the frame grows to fit the app, so sizes are fixed (vh would follow the frame and shrink it); full screen
   has the window's height. */
.stage video { display: block; width: 100%; max-height: 480px; background: #000; }
.stage.tall video { width: auto; max-width: 100%; height: 540px; max-height: none; }
/* Full screen the player gets what the panel can spare while the comments keep at least about 160 px. */
html.fs .stage video { max-height: max(220px, min(62vh, calc(100vh - 560px))); }
html.fs .stage.tall video { height: max(220px, min(62vh, calc(100vh - 560px))); }
.noprev { color: #aaa; padding: 60px 16px; text-align: center; }
/* The player's own controls: the browser's show whole seconds, these show milliseconds (like the editor). The seek
   bar carries the comments as dots. */
.stage video { cursor: pointer; }
/* The drawing sits exactly on the picture (the player keeps the picture's shape inside its box). */
.frame { position: relative; width: 100%; display: flex; justify-content: center; }
.ink { position: absolute; pointer-events: none; }
.ink.on { pointer-events: auto; cursor: crosshair; touch-action: none; outline: 2px solid var(--accent); outline-offset: -2px; }
.pens { display: flex; gap: 4px; }
.pen { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.pen.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.ibtn.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
/* Full screen the share panel floats over the page, so the comments keep their room. */
html.fs .share { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 20px)); z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.sm { display: none; }
.shade { display: none; }
html.fs .shade { display: block; position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.25); }
.share { border: 1px solid var(--accent); background: var(--panel); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.share input { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: var(--r-sm); padding: 8px 10px; font: 13px var(--mono); }
/* Phones: one column, bigger targets, nothing wider than the screen. */
@media (max-width: 560px) {
  body { padding: 10px; }
  h1 { font-size: 16px; }
  .top { gap: 6px; }
  .top .grow { flex-basis: calc(100% - 120px); }
  .search { width: 100%; order: 5; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .stage video { max-height: 300px; }
  .stage.tall video { height: 440px; }
  .ctrl { flex-wrap: wrap; row-gap: 6px; gap: 4px; }
  .tc { font-size: 13px; padding: 0 2px; }
  .tc .tot { display: none; } /* the seek bar shows how far along it is */
  .lg { display: none; } .sm { display: inline; }
  .top .btn { padding: 6px 9px; }
  .ibtn { width: 40px; height: 38px; }
  .btn, .step { min-height: 36px; }
  html .compose textarea { font-size: 16px; } /* 16 px or more: phones do not zoom in when it is tapped */
  .cm .act { padding: 6px 8px; font-size: 13px; }
  .cm .chk { width: 30px; height: 30px; }
  .pen { width: 30px; height: 30px; }
}
@media (pointer: coarse) { .keyhint { display: none; } }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.seek { position: relative; height: 22px; margin: -2px 7px 0; cursor: pointer; flex: none; touch-action: none; }
.seek .bar { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.seek .fill { height: 100%; width: 0; background: var(--accent); }
.seek .head { position: absolute; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--bg); transform: translateX(-7px); pointer-events: none; }
.seek .mk { position: absolute; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); transform: translateX(-5px); padding: 0; }
.seek .mk.done { background: var(--faint); }
.seek .mk.client { background: #6ea8ff; }
.ctrl { display: flex; align-items: center; gap: 6px; flex: none; }
.ibtn { width: 34px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.ibtn:hover { background: var(--surface); }
.ibtn svg { width: 16px; height: 16px; fill: currentColor; }
.tc { font-size: 14px; padding: 0 6px; }
.step { font-size: 12px; padding: 5px 8px; }
.note { padding: 9px 11px; border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--hair); font-size: 13px; }
.note.err { color: var(--danger); }
.prog { height: 4px; background: var(--surface); border-radius: 4px; overflow: hidden; margin-top: 7px; }
.prog > div { height: 100%; background: var(--accent); transition: width .4s ease; }
.compose { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-md); padding: 8px; }
.compose textarea { width: 100%; resize: vertical; min-height: 54px; max-height: 200px; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 2px 4px; }
.compose.drop { outline: 2px dashed var(--accent); }
.editing-bar { font-size: 12px; color: var(--accent-ink); padding: 0 4px 6px; }
.atts { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 2px 6px; }
.att { position: relative; }
.att canvas, .att img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; background: var(--surface); }
.att .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-size: 11px; line-height: 18px; padding: 0; }
.at { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); border: 0; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 4px 8px; border-radius: var(--r-sm); font-size: 13px; }
.tab.on { background: var(--panel); color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
.btn.big { padding: 7px 13px; font-weight: 600; border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.btn.big:hover:not(:disabled) { background: var(--accent-soft); filter: brightness(1.1); }
.cm { border: 1px solid var(--hair); background: var(--panel); border-radius: var(--r-md); padding: 8px 10px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: start; }
.cm.done { opacity: .6; }
.cm .t { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--surface); border: 0; }
.cm .t:hover { background: var(--accent-soft); color: var(--accent-ink); }
.cm .who { font-size: 12px; color: var(--muted); }
.cm .txt { grid-column: 1 / -1; white-space: pre-wrap; word-break: break-word; }
.cm .acts { display: flex; gap: 2px; align-items: center; }
.cm .act { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 6px; }
.cm .act:hover { background: var(--surface); color: var(--ink); }
.cm .act.warn { color: var(--danger); }
.cm .txt a, .compose a { color: var(--accent-ink); text-decoration: underline; word-break: break-all; }
.cm .media { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.thumbimg { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface); display: block; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.cm.editing { border-color: var(--accent); }
.cm .chk { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0; font-size: 13px; }
.cm.done .chk { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 12px; border-radius: var(--r-sm); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .95; }
.skel { height: 160px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--panel), var(--surface), var(--panel)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="root"><div class="skel"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
(() => {
  // ---------------- the host bridge (MCP Apps, JSON-RPC over postMessage) ----------------
  const PROTOCOL = "2026-01-26";
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage(msg, "*");
  const request = (method, params, ms = 60000) => new Promise((resolve, reject) => {
    const id = nextId++;
    const timer = setTimeout(() => { pending.delete(id); reject(new Error("Rendrr did not answer in time.")); }, ms);
    pending.set(id, { resolve: (v) => { clearTimeout(timer); resolve(v); }, reject: (e) => { clearTimeout(timer); reject(e); } });
    post({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params || {} });
  let host = { caps: {}, ctx: {} };

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method) {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || "The host refused that."));
      else p.resolve(m.result);
      return;
    }
    if (m.id != null && m.method) {
      // Requests from the host: teardown and ping are answered, anything else is not known here.
      if (m.method === "ui/resource-teardown" || m.method === "ping") { stopPolling(); post({ jsonrpc: "2.0", id: m.id, result: {} }); }
      else post({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "Method not found" } });
      return;
    }
    if (m.method === "ui/notifications/tool-input") onToolInput((m.params && m.params.arguments) || {});
    else if (m.method === "ui/notifications/tool-result") onToolResult(m.params || {});
    else if (m.method === "ui/notifications/host-context-changed") applyContext(m.params || {});
    else if (m.method === "ui/notifications/tool-cancelled") { if (!state.page) loadList(); }
  });

  async function callTool(name, args) {
    const r = await request("tools/call", { name, arguments: args || {} });
    const text = ((r && r.content) || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    if (r && r.isError) throw new Error(text || "That did not work.");
    return (r && r.structuredContent) || null;
  }
  const openLink = (url) => request("ui/open-link", { url }).catch(() => toast("Could not open the link."));
  const sendMessage = (text) => request("ui/message", { role: "user", content: [{ type: "text", text }] });
  const tellModel = (text) => { if (host.caps.updateModelContext) request("ui/update-model-context", { content: [{ type: "text", text }] }).catch(() => {}); };

  function applyContext(ctx) {
    host.ctx = Object.assign({}, host.ctx, ctx);
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const k in vars) if (vars[k] != null) document.documentElement.style.setProperty(k, vars[k]);
    if (ctx.displayMode) { document.documentElement.classList.toggle("fs", ctx.displayMode === "fullscreen"); lastH = 0; if (state.page || state.project) render(); }
  }

  // Full screen is the host's own panel (like a media viewer): asked for when the user opens an edit, or with the button.
  const canFullscreen = () => (host.ctx.availableDisplayModes || []).includes("fullscreen");
  const isFullscreen = () => host.ctx.displayMode === "fullscreen";
  const setDisplay = (mode) => request("ui/request-display-mode", { mode }).then((r) => { if (r && r.mode) applyContext({ displayMode: r.mode }); }).catch(() => {});
  const fsButton = () => !canFullscreen() ? null : isFullscreen()
    ? h("button", { class: "btn ghost", "aria-label": "Exit full screen", onClick: () => setDisplay("inline") }, h("span", { class: "lg" }, "Exit full screen"), h("span", { class: "sm" }, "Exit"))
    : h("button", { class: "btn big", title: "Open the player and comments full screen", onClick: () => setDisplay("fullscreen") }, "⤢ ", h("span", { class: "lg" }, "Full screen"), h("span", { class: "sm" }, "Full"));

  // Tell the host how tall the app is, whenever that changes.
  let lastH = 0;
  // Inline only: full screen, the host gives the app its whole panel.
  const sizeNow = () => { if (host.ctx.displayMode === "fullscreen") return; const h = Math.ceil(document.documentElement.getBoundingClientRect().height); if (Math.abs(h - lastH) > 1) { lastH = h; notify("ui/notifications/size-changed", { height: h }); } };
  new ResizeObserver(sizeNow).observe(document.documentElement);

  // ---------------- state ----------------
  const state = { view: "list", page: null, query: "", loadingMore: false, project: null, filter: "open", draft: "", webUrl: null, err: null, pendingProject: null, busy: false,
    // The comment being written or edited: its moment (null: the player's), drawing, pictures; drawing on the player.
    compose: null, drawMode: false, pen: "#ff3b30", viewDrawing: null, confirmDelete: null, lightbox: null, sending: false, share: null };
  const freshCompose = () => ({ editingId: null, time: null, drawing: null, drawingChanged: false, images: [], removeImages: [] });
  state.compose = freshCompose();
  // The player lives across redraws (a poll every few seconds must not reload it); views hook into its time.
  let player = null, polling = null, wantedId = null, timeHooks = [];

  function onToolInput(args) { if (args.projectId) { wantedId = args.projectId; } }
  function onToolResult(res) {
    const d = res.structuredContent;
    if (res.isError || !d) { state.err = ((res.content || [])[0] || {}).text || null; if (!state.page) loadList(); return; }
    state.page = { projects: d.projects || [], total: d.total || 0, offset: 0 };
    state.webUrl = d.webUrl || null;
    const again = !d.open && isFullscreen() ? remembered() : null;
    if (d.open) showProject(d.open); else if (again) openProject(again); else { state.view = "list"; render(); }
  }

  async function loadList(more) {
    try {
      const off = more && state.page ? state.page.projects.length : 0;
      const d = await callTool("app_list_projects", { offset: off, limit: 24, query: state.query || undefined });
      if (!d) return;
      state.page = more && state.page ? { projects: state.page.projects.concat(d.projects), total: d.total, offset: 0 } : d;
      state.err = null;
    } catch (e) { state.err = e.message; }
    state.loadingMore = false;
    if (state.view === "list") render();
  }

  function showProject(view) {
    const prevRender = state.project && state.project.preview && state.project.preview.renderId;
    const sameProject = state.project && state.project.project.id === view.project.id;
    state.project = view; state.view = "project";
    if (!sameProject) { state.filter = view.comments.some((c) => !c.resolved) || !view.comments.length ? "open" : "all"; state.draft = ""; state.compose = freshCompose(); state.drawMode = false; state.viewDrawing = null; state.share = null; }
    const fresh = sameProject && view.preview && view.preview.renderId !== prevRender;
    render(fresh);
    schedulePoll();
  }

  // If the host starts the app again when it goes full screen, the edit the user just opened opens again.
  const remember = (id) => { try { sessionStorage.setItem("rendrr-open", JSON.stringify({ id, at: Date.now() })); } catch {} };
  const remembered = () => { try { const r = JSON.parse(sessionStorage.getItem("rendrr-open") || "null"); return r && Date.now() - r.at < 30000 ? r.id : null; } catch { return null; } };

  async function openProject(id) {
    remember(id);
    state.view = "project"; state.project = null; state.pendingProject = id; render();
    try { const v = await callTool("app_get_project", { projectId: id }); if (v && state.pendingProject === id) showProject(v); }
    catch (e) { state.err = e.message; state.view = "list"; render(); }
  }

  // While a preview renders, its progress every 3 s; otherwise a look every 20 s, so a render your AI starts shows up.
  function schedulePoll() {
    stopPolling();
    if (state.view !== "project" || !state.project) return;
    const ms = state.project.rendering ? 3000 : 20000;

  // ---------------- pictures ----------------
  const readB64 = (blob) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
  // A picture as the comment keeps it: small files as they are, big ones made 1600 px or smaller (JPEG).
  async function readImage(file) {
    const bmp = await createImageBitmap(file);
    let w = bmp.width, hh = bmp.height, type = file.type, data;
    if (["image/jpeg", "image/png", "image/webp"].includes(file.type) && file.size <= 1_000_000 && Math.max(w, hh) <= 2400) data = await readB64(file);
    else {
      const k = Math.min(1, 1600 / Math.max(w, hh)), cv = document.createElement("canvas");
      cv.width = Math.round(w * k); cv.height = Math.round(hh * k);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      type = "image/jpeg"; w = cv.width; hh = cv.height;
      data = cv.toDataURL("image/jpeg", 0.85).split(",")[1];
      if (data.length > 1_400_000) data = cv.toDataURL("image/jpeg", 0.6).split(",")[1];
    }
    const thumb = document.createElement("canvas"); thumb.width = 128; thumb.height = 96;
    const tk = Math.max(128 / bmp.width, 96 / bmp.height);
    thumb.getContext("2d").drawImage(bmp, (128 - bmp.width * tk) / 2, (96 - bmp.height * tk) / 2, bmp.width * tk, bmp.height * tk);
    return { local: Math.random().toString(36).slice(2), type, data, name: file.name || null, w, h: hh, thumb };
  }
  async function addImages(files) {
    const c = state.compose;
    const have = c.images.length;
    const list = Array.from(files || []).filter((f) => /^image\//.test(f.type));
    if (!list.length) return;
    if (have + list.length > 4) toast("Up to 4 pictures on a comment.");
    for (const f of list.slice(0, Math.max(0, 4 - have))) {
      try { c.images.push(await readImage(f)); } catch { toast("Could not read " + (f.name || "that picture") + "."); }
    }
    if (c.time == null && player) c.time = Math.round(player.currentTime * 1000) / 1000;
    render();
  }

  // ---------------- links ----------------
  // Web addresses in a comment open in the browser (through the host); everything else stays plain text.
  function linkify(text) {
    const out = [], re = /\b(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;
    let last = 0, m;
    while ((m = re.exec(text))) {
      const url = m[0].replace(/[.,;:!?)\]]+$/, "");
      const href = /^https?:/i.test(url) ? url : "https://" + url;
      out.push(text.slice(last, m.index), h("a", { href, title: href, onClick: (e) => { e.preventDefault(); openLink(href); } }, url));
      last = m.index + url.length; re.lastIndex = last;
    }
    out.push(text.slice(last));
    return out;
  }

  function commentsView(v) {
    const open = v.comments.filter((c) => !c.resolved);
    const shown = state.filter === "open" ? open : v.comments;
    // The new comment goes at the player's moment (or the moment it was drawn on); typing pauses the player so it holds.
    const c = state.compose;
    const momentOf = () => (c.time != null ? c.time : player ? player.currentTime : 0);
    const at = h("button", { class: "at mono", title: "Go to this moment", onClick: () => seek(momentOf()) }, "at " + fmtTime(momentOf()));
    onTime(() => { at.textContent = "at " + fmtTime(momentOf()); });
    const canSend = () => !state.sending && (state.draft.trim() || (c.drawing && c.drawing.strokes.length) || c.images.length);
    const ta = h("textarea", { placeholder: v.preview ? "Write a comment at this moment, paste a link or a picture…" : "Write a comment, paste a link or a picture…", "aria-label": "Comment", maxlength: "2000", "data-key": "draft",
      onFocus: () => { if (player && !player.paused) player.pause(); },
      onInput: (e) => { state.draft = e.target.value; add.disabled = !canSend(); },
      onPaste: (e) => { const fs = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => /^image\//.test(f.type)); if (fs.length) { e.preventDefault(); addImages(fs); } },
      onKeydown: (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); } else if (e.key === "Escape" && c.editingId) cancelEdit(); } });
    ta.value = state.draft;
    const add = h("button", { class: "btn primary", disabled: !canSend(), onClick: () => submit() }, state.sending ? "Saving…" : c.editingId ? "Save" : "Comment");
    const file = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp,image/gif", multiple: true, style: "display:none", onChange: (e) => { addImages(e.target.files); e.target.value = ""; } });
    async function submit() {
      if (!canSend()) return;
      const text = state.draft.trim(), time = Math.round(momentOf() * 1000) / 1000;
      const fresh = c.images.filter((im) => !im.existing).map((im) => ({ type: im.type, data: im.data, name: im.name || undefined, w: im.w, h: im.h }));
      const drawing = c.drawing && c.drawing.strokes.length ? { w: c.drawing.w, h: c.drawing.h, strokes: c.drawing.strokes, png: drawingPng(c.drawing) } : null;
      state.sending = true; add.disabled = true; add.textContent = "Saving…";
      try {
        const nv = c.editingId
          ? await callTool("app_edit_comment", { projectId: v.project.id, commentId: c.editingId, text, ...(c.drawingChanged ? { drawing } : {}), ...(c.removeImages.length ? { removeImages: c.removeImages } : {}), ...(fresh.length ? { images: fresh } : {}) })
          : await callTool("app_add_comment", { projectId: v.project.id, time, text, ...(v.preview ? { renderId: v.preview.renderId } : {}), ...(drawing ? { drawing } : {}), ...(fresh.length ? { images: fresh } : {}) });
        const what = [drawing ? "a drawing" : "", c.images.length ? c.images.length + (c.images.length === 1 ? " picture" : " pictures") : ""].filter(Boolean).join(" and ");
        tellModel("In the Rendrr app the user " + (c.editingId ? "changed their comment" : "added a comment") + " on \"" + v.project.name + "\" (" + v.project.id + ") at " + fmtTime(time) + (v.preview ? " of preview v" + v.preview.version : "") + ": " + (text || "(no words)") + (what ? " (with " + what + "; get_comments images true shows them)" : ""));
        toast(c.editingId ? "Comment saved." : "Comment added. It is in Rendrr too.");
        state.draft = ""; state.compose = freshCompose(); state.filter = "open"; state.sending = false;
        if (nv) showProject(nv); else render();
      } catch (e) { state.sending = false; toast(e.message); add.disabled = !canSend(); add.textContent = c.editingId ? "Save" : "Comment"; }
    }
    const atts = [];
    if (c.drawing && c.drawing.strokes.length) atts.push(h("span", { class: "badge", title: "Shown on the picture at " + fmtTime(c.time || 0) }, "✎ Drawing ", h("button", { class: "act", "aria-label": "Take the drawing off", onClick: () => { c.drawing = null; c.drawingChanged = true; render(); } }, "×")));
    for (const im of c.images) atts.push(h("span", { class: "att" }, im.existing ? h("img", { src: im.url, alt: im.name || "Picture" }) : im.thumb,
      h("button", { class: "x", "aria-label": "Take this picture off", onClick: () => { c.images = c.images.filter((x) => x !== im); if (im.existing) c.removeImages.push(im.id); render(); } }, "×")));
    const compose = h("div", { class: "compose",
      onDragover: (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) { e.preventDefault(); e.currentTarget.classList.add("drop"); } },
      onDragleave: (e) => e.currentTarget.classList.remove("drop"),
      onDrop: (e) => { e.preventDefault(); e.currentTarget.classList.remove("drop"); addImages(e.dataTransfer && e.dataTransfer.files); } },
      c.editingId ? h("div", { class: "row editing-bar" }, h("span", { class: "grow" }, "Editing your comment at " + fmtTime(c.time || 0)), h("button", { class: "act", onClick: cancelEdit }, "Cancel")) : null,
      ta, atts.length ? h("div", { class: "atts" }, atts) : null,
      h("div", { class: "row" }, at,
        h("button", { class: "btn ghost step", title: "Add a picture (or paste or drop one)", disabled: c.images.length >= 4, onClick: () => file.click() }, "🖼 Picture"), file,
        h("span", { class: "grow muted small keyhint" }, navigator.platform.includes("Mac") ? "⌘ Enter" : "Ctrl Enter"), h("span", { class: "grow" }), add));

    const tabs = h("div", { class: "row" },
      h("div", { class: "tabs grow" },
        h("button", { class: "tab" + (state.filter === "open" ? " on" : ""), onClick: () => { state.filter = "open"; render(); } }, "Open " + open.length),
        h("button", { class: "tab" + (state.filter === "all" ? " on" : ""), onClick: () => { state.filter = "all"; render(); } }, "All " + v.comments.length)),
      h("button", { class: "btn primary", disabled: !open.length, title: open.length ? "Ask your AI to work through the open comments" : "No open comments", onClick: () => sendToAi(v, open) }, "Send to Claude"));

    const look = (x) => { seek(x.time); if (player) player.pause(); state.viewDrawing = x.drawing ? { time: x.time, strokes: x.drawing.strokes } : null; requestAnimationFrame(drawInk); };
    const items = shown.map((x) => h("div", { class: "cm" + (x.resolved ? " done" : "") + (c.editingId === x.id ? " editing" : ""), "data-id": x.id },
      h("button", { class: "t mono", title: "Go to " + fmtTime(x.time), onClick: () => look(x) }, fmtTime(x.time)),
      h("span", { class: "who" }, (x.mine ? x.author || "You" : x.author + " (client)") + " · " + ago(x.at) + (x.edited ? " · edited" : "")),
      h("span", { class: "acts" },
        x.mine ? h("button", { class: "act", title: "Edit", onClick: () => startEdit(x) }, "Edit") : null,
        h("button", { class: "act" + (state.confirmDelete === x.id ? " warn" : ""), title: "Delete", onClick: () => askDelete(v, x) }, state.confirmDelete === x.id ? "Delete?" : "Delete"),
        h("button", { class: "chk", title: x.resolved ? "Open again" : "Resolve", "aria-label": x.resolved ? "Open again" : "Resolve", onClick: () => resolve(v, x) }, x.resolved ? "✓" : "")),
      x.text ? h("div", { class: "txt" }, linkify(x.text)) : null,
      x.drawing || (x.images && x.images.length) ? h("div", { class: "media" },
        x.drawing ? h("button", { class: "badge", title: "Show the drawing on the picture", onClick: () => look(x) }, "✎ Drawing") : null,
        (x.images || []).map((im) => h("img", { class: "thumbimg", src: im.url, alt: im.name || "Picture", title: im.name || "Picture", onClick: () => { state.lightbox = im.url; render(); } }))) : null));
    const list = items.length ? h("div", { class: "list", "data-key": "comments" }, items) : h("div", { class: "empty", style: "padding:18px" }, state.filter === "open" && v.comments.length ? "Every comment is resolved." : "No comments yet. Play the preview, pause where something should change, and write it here.");
    return h("div", { class: "side" }, tabs, list, compose);
  }

  function startEdit(x) {
    state.compose = { editingId: x.id, time: x.time, drawing: x.drawing ? { w: x.drawing.w, h: x.drawing.h, strokes: x.drawing.strokes.map((st) => ({ c: st.c, w: st.w, p: st.p.slice() })) } : null, drawingChanged: false,
      images: (x.images || []).map((im) => ({ existing: true, id: im.id, url: im.url, name: im.name })), removeImages: [] };
    state.draft = x.text; state.drawMode = false; state.viewDrawing = null;
    seek(x.time); if (player) player.pause();
    render();
    const ta = document.querySelector('[data-key="draft"]'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  function cancelEdit() { state.compose = freshCompose(); state.draft = ""; state.drawMode = false; render(); }
  let deleteTimer = null;
  async function askDelete(v, x) {
    if (state.confirmDelete !== x.id) { state.confirmDelete = x.id; clearTimeout(deleteTimer); deleteTimer = setTimeout(() => { state.confirmDelete = null; render(); }, 3000); render(); return; }
    state.confirmDelete = null; clearTimeout(deleteTimer);
    try {
      const nv = await callTool("app_delete_comment", { projectId: v.project.id, commentId: x.id });
      if (state.compose.editingId === x.id) { state.compose = freshCompose(); state.draft = ""; }
      tellModel("In the Rendrr app the user deleted the comment at " + fmtTime(x.time) + " on \"" + v.project.name + "\": " + (x.text || "(no words)"));
      toast("Comment deleted.");
      if (nv) showProject(nv);
    } catch (e) { toast(e.message); }
  }

  async function resolve(v, c) {
    try { const nv = await callTool("app_resolve_comment", { projectId: v.project.id, commentId: c.id, resolved: !c.resolved }); if (nv) showProject(nv); }
    catch (e) { toast(e.message); }
  }

  async function renderPreview() {
    if (!state.project) return;
    state.busy = true; render();
    try { const nv = await callTool("app_render_preview", { projectId: state.project.project.id }); state.busy = false; if (nv) showProject(nv); }
    catch (e) { state.busy = false; render(); toast(e.message); }
  }

  async function sendToAi(v, open) {
    const carries = (c) => { const w = [c.drawing ? "drawing" : "", c.images && c.images.length ? c.images.length + (c.images.length === 1 ? " picture" : " pictures") : ""].filter(Boolean); return w.length ? " (" + w.join(", ") + ")" : ""; };
    const lines = open.slice(0, 30).map((c) => "- " + fmtTime(c.time) + " " + (c.text || "(no words)").replace(/\s+/g, " ").slice(0, 300) + carries(c));
    const media = open.some((c) => c.drawing || (c.images && c.images.length));
    const text = "Please work through the " + open.length + " open " + (open.length === 1 ? "comment" : "comments") + " on my Rendrr edit \"" + v.project.name + "\" (project " + v.project.id + ")" + (v.preview ? ", made on preview v" + v.preview.version : "") + ":\n" + lines.join("\n") +
      "\n\nRead them with get_comments" + (media ? " (images true shows the drawings and pictures)" : "") + ", fix each one and the same kind of mistake everywhere in one apply_edits, check it with check_edit, render one preview, then resolve the comments you fixed.";
    try { const r = await sendMessage(text); if (r && r.isError) throw new Error(); toast("Sent to Claude."); }
    catch { toast("Could not send it. Copy the comments into the chat instead."); }
  }

  document.addEventListener("keydown", (e) => {
    if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
    if (e.key === "Escape" && state.lightbox) { state.lightbox = null; render(); return; }
    if (e.key === "Escape" && state.drawMode) { endDraw(); return; }
    if (e.key === " " && e.target && e.target.tagName === "BUTTON") return; // the button's own click does it
    if (e.key === " " && player) { e.preventDefault(); togglePlay(); }
    else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && player) { e.preventDefault(); step((e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 1 : 0.1)); }
  });

  // ---------------- start ----------------
  (async () => {
    try {
      const r = await request("ui/initialize", { appInfo: { name: "rendrr-projects", version: "1.0.0" }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] }, protocolVersion: PROTOCOL }, 15000);
      host.caps = (r && r.hostCapabilities) || {};
      applyContext((r && r.hostContext) || {});
      notify("ui/notifications/initialized", {});
    } catch { /* an old host: carry on, the tools may still work */ }
    // The host sends open_projects' result; if it does not come, ask for the list (or the edit) directly.
    setTimeout(() => { if (!state.page && !state.project) { if (wantedId) openProject(wantedId); loadList(); } }, 2500);
  })();
})();
</script>
</body>
</html>
