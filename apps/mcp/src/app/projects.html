<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendrr projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap">
<style>
/* Rendrr in the chat: every edit, each one's latest preview, its comments. One file, no network of its own: the
   preview and thumbnails are signed storage links, data comes through the host from Rendrr's MCP server.
   The look is the Rendrr web app's (apps/web/src/rendrr/styles.css), whatever the host's theme: dark only, three dark
   steps (page, panel, surface), white washes instead of greys, lime as the one colour, Inter to read, Space Grotesk
   bold uppercase for titles (from Google Fonts, the web app's own; the system font when the host blocks it). */
:root {
  --bg: #0f1113; --panel: #131517; --surface: #1c1e21;
  --raised: rgba(255,255,255,.05); --raised-strong: rgba(255,255,255,.1); --line: rgba(255,255,255,.1);
  --hair: rgba(255,255,255,.05); --hair-strong: rgba(255,255,255,.1);
  --ink: #f7f7f8; --muted: #898a8b; --dim: #a8a8a8; --faint: rgba(255,255,255,.5); --ghost: rgba(255,255,255,.3);
  --accent: #bde816; --accent-edge: #7f9a1a; --accent-soft: rgba(189,232,22,.1); --accent-tint: rgba(189,232,22,.24); --accent-ring: rgba(189,232,22,.48);
  --on-accent: #1a1a1a;
  --shadow-card: 0 0 0 1px var(--hair);
  --shadow-button: inset 0 -3px 0 0 var(--accent-edge), 0 6px 4px rgba(0,0,0,.25);
  --shadow-quiet: inset 0 1.5px 3px rgba(255,255,255,.05);
  --shadow-indicator: 0 2px 2px rgba(0,0,0,.12), inset 0 2px 3px rgba(255,255,255,.05);
  --shadow-pop: 0 0 0 1px var(--hair-strong), 0 16px 40px rgba(0,0,0,.6);
  --r-xs: 6px; --r-sm: 8px; --r-btn: 10px; --r-md: 12px; --r-lg: 16px; --pill: 999px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --ease: cubic-bezier(0,0,.2,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/22px var(--font); letter-spacing: -.005em; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
/* --it/--ir/--ib/--il: where the host's own bars cover the app (Claude's phone panel: its header on top, its chat box
   at the bottom), from the host's safe area insets. */
body { padding: calc(16px + var(--it, 0px)) calc(16px + var(--ir, 0px)) calc(16px + var(--ib, 0px)) calc(16px + var(--il, 0px)); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; border-radius: var(--r-btn); }
::selection { background: var(--accent-tint); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; line-height: 16px; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* Buttons: quiet (white wash), primary (lime with its edge), ghost, the lime tint (Full screen). */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--r-btn); background: var(--raised); color: var(--ink); font-weight: 500; font-size: 14px; white-space: nowrap; box-shadow: var(--shadow-quiet); transition: transform .2s var(--ease), background-color .2s var(--ease), box-shadow .15s var(--ease); user-select: none; }
.btn:hover:not(:disabled) { background: var(--raised-strong); }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: var(--shadow-button); padding-bottom: 2px; }
.btn.primary:hover:not(:disabled) { background: #c8ee3a; }
.btn.primary:disabled { background: var(--accent-tint); color: var(--accent); box-shadow: none; opacity: .7; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--raised); }
.btn.big { background: var(--accent-tint); color: var(--accent); font-weight: 600; box-shadow: 0 0 0 2px rgba(0,0,0,.09); }
.btn.big:hover:not(:disabled) { background: var(--accent-ring); color: #e4f7a0; }
h1 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: 0; }
.pv h1 { font-family: var(--font); font-size: 16px; line-height: 22px; font-weight: 600; text-transform: none; letter-spacing: -.01em; }
.top { margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.head .top { margin-bottom: 0; flex-wrap: nowrap; }
.title h1, .title .small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { height: 36px; border: 0; border-radius: var(--r-btn); background: var(--raised); color: var(--ink); padding: 0 12px; font-size: 14px; width: 100%; max-width: 420px; outline: none; transition: background-color .2s var(--ease), box-shadow .2s var(--ease); }
.search::placeholder, textarea::placeholder { color: var(--ghost); }
.search:focus { background: var(--raised-strong); box-shadow: 0 0 0 2px var(--accent-ring); }

/* All projects: the web app's cards (the picture, the name over its foot, the line under it). */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s var(--ease), transform .2s var(--ease); }
.card:hover { box-shadow: var(--shadow-pop); }
.card:active { transform: scale(.99); }
.card:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
.thumb { position: relative; aspect-ratio: 16 / 10; background: radial-gradient(120% 90% at 30% 10%, #3a3d42, #16181b 70%) center / cover no-repeat; }
.thumb > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.78)); }
.thumb .over { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.thumb .name { font-weight: 600; font-size: 15px; line-height: 20px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.thumb .sub { font-size: 11.5px; line-height: 16px; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb .dur, .thumb .shape { position: absolute; z-index: 1; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; line-height: 16px; padding: 2px 7px; border-radius: var(--r-xs); backdrop-filter: blur(4px); }
.thumb .dur { right: 10px; top: 10px; }
.thumb .shape { left: 10px; top: 10px; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--pill); font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--raised); color: var(--dim); box-shadow: 0 0 0 1px var(--hair), inset 0 2px 3px rgba(255,255,255,.03); }
.chip.ok { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.chip.warn { background: var(--raised-strong); color: var(--ink); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); background: var(--raised); border-radius: var(--r-lg); }
.more { margin: 16px auto 0; display: flex; }

/* One edit, top to bottom: the player, the comments, the box to write one. Full screen it fills the host's panel:
   the player on top, the comments scroll in the middle, the box stays at the bottom. */
.pv { display: flex; flex-direction: column; gap: 10px; }
.pv .side { display: flex; flex-direction: column; gap: 10px; }
html.fs, html.fs body { height: 100%; }
html.fs body { padding: calc(16px + var(--it, 0px)) calc(20px + var(--ir, 0px)) calc(16px + var(--ib, 0px)) calc(20px + var(--il, 0px)); overflow: hidden; }
html.fs #root { height: 100%; overflow: auto; }
html.fs .pv { height: 100%; }
html.fs .pv .side { flex: 1; min-height: 0; }
html.fs .pv .side > .list, html.fs .pv .side > .empty { flex: 1; min-height: 0; max-height: none; }
.pv .top { margin-bottom: 0; }
.pv .top .meta { font-size: 12px; line-height: 16px; color: var(--muted); }
.stage { background: #000; border-radius: var(--r-md); overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: var(--shadow-card); }
/* Inline, the frame grows to fit the app, so sizes are fixed (vh would follow the frame and shrink it); full screen
   has the window's height. */
.stage video { display: block; width: 100%; max-height: 480px; background: #000; cursor: pointer; }
.stage.tall video { width: auto; max-width: 100%; height: 540px; max-height: none; }
/* Full screen the player gets what the panel can spare while the comments keep at least about 160 px. */
html.fs .stage video { max-height: max(220px, min(60vh, calc(100vh - 600px))); }
html.fs .stage.tall video { height: max(220px, min(60vh, calc(100vh - 600px))); }
.noprev { color: var(--dim); padding: 64px 16px; text-align: center; }
/* The drawing sits exactly on the picture (the player keeps the picture's shape inside its box). */
.frame { position: relative; width: 100%; display: flex; justify-content: center; }
.ink { position: absolute; pointer-events: none; }
.ink.on { pointer-events: auto; cursor: crosshair; touch-action: none; outline: 2px solid var(--accent); outline-offset: -2px; }
/* The time over the picture, as in the editor's player. */
.stamp { position: absolute; left: 10px; top: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); background: rgba(0,0,0,.55); color: #fff; font-size: 12px; backdrop-filter: blur(4px); pointer-events: none; }
.stamp i { font-style: normal; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.18); }
.pens { display: flex; gap: 6px; }
.pen { width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 2px var(--hair-strong); }
.pen.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
/* Full screen the share panel floats over the page, so the comments keep their room. */
html.fs .share { position: fixed; top: calc(12px + var(--it, 0px)); left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); z-index: 6; }
.sm { display: none; }
.shade { display: none; }
html.fs .shade { display: block; position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.65); }
.share { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.share b { font-weight: 600; font-size: 15px; }
.share input { width: 100%; height: 40px; border: 0; background: var(--raised); color: var(--ink); border-radius: var(--r-btn); padding: 0 12px; font-size: 13px; font-variant-numeric: tabular-nums; outline: none; }
.share input:focus { box-shadow: 0 0 0 2px var(--accent-ring); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--r-md); }

/* The seek bar, big enough to hold and drag: a tall strip to grab, the track in it (thicker under the pointer), the
   time under the pointer above it, and the comments as pins under it, like Frame.io: each one its author's initial,
   pointing up at its moment; the comment being written gets a lime pin that follows it. */
.seek { position: relative; height: 64px; margin: 0 14px; flex: none; touch-action: none; user-select: none; -webkit-user-select: none; }
.seek .hit { position: absolute; left: -14px; right: -14px; top: 0; height: 36px; cursor: pointer; }
.seek .bar { position: absolute; left: 0; right: 0; top: 15px; height: 8px; background: var(--raised-strong); box-shadow: inset 0 0 0 1px var(--hair); border-radius: 4px; overflow: hidden; pointer-events: none; transition: top .12s var(--ease), height .12s var(--ease); }
.seek:hover .bar, .seek.drag .bar { top: 13px; height: 12px; border-radius: 6px; }
.seek .fill { height: 100%; width: 0; background: var(--ink); }
.seek .head { position: absolute; top: 9px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--bg), 0 2px 8px rgba(0,0,0,.5); pointer-events: none; z-index: 4; transition: transform .12s var(--ease); }
.seek.drag .head { transform: scale(1.25); }
.seek .tick { position: absolute; top: 15px; width: 2px; height: 8px; margin-left: -1px; background: var(--accent); pointer-events: none; z-index: 1; border-radius: 1px; }
.seek .tick.done { background: var(--muted); }
.seek .tip { position: absolute; top: -18px; transform: translateX(-50%); padding: 1px 7px; border-radius: var(--r-xs); background: var(--surface); box-shadow: var(--shadow-pop); font-size: 11.5px; line-height: 18px; font-variant-numeric: tabular-nums; pointer-events: none; display: none; z-index: 5; white-space: nowrap; }
.seek:hover .tip, .seek.drag .tip { display: block; }
.seek .pin { --pin: var(--accent); position: absolute; top: 36px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: var(--pin); color: var(--on-accent); font-size: 11px; font-weight: 700; line-height: 26px; text-align: center; padding: 0; box-shadow: 0 0 0 2px var(--bg); z-index: 2; transition: transform .15s var(--ease); }
.seek .pin::before { content: ""; position: absolute; left: 50%; top: -7px; margin-left: -5px; border: 5px solid transparent; border-bottom: 6px solid var(--pin); border-top: 0; }
.seek .pin:hover, .seek .pin.on { transform: translateY(-2px) scale(1.1); z-index: 3; }
.seek .pin.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-ring); }
.seek .mk.client { --pin: var(--ink); color: var(--bg); }
.seek .mk.done { --pin: #4a4d52; color: var(--dim); }
.seek .pin.draft { --pin: var(--accent); background: var(--bg); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); font-size: 15px; display: none; z-index: 3; pointer-events: none; }
.seek .pin.draft.show { display: block; }
.cm.flash { box-shadow: 0 0 0 2px var(--accent-ring); transition: box-shadow .3s; }
/* The transport row, as in the editor: play, the time to the ms, steps, sound. */
.ctrl { display: flex; align-items: center; gap: 6px; flex: none; padding: 6px; background: var(--panel); border-radius: var(--r-md); box-shadow: var(--shadow-card); }
.ibtn { width: 36px; height: 36px; border-radius: var(--r-btn); background: var(--raised); box-shadow: var(--shadow-quiet); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.ibtn:hover { background: var(--raised-strong); }
.ibtn svg { width: 16px; height: 16px; fill: currentColor; }
.tc { font-size: 14px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.tc .tot { color: var(--muted); }
.step { height: 32px; font-size: 13px; padding: 0 10px; }
.note { padding: 10px 12px; border-radius: var(--r-md); background: var(--raised); font-size: 13px; line-height: 20px; }
.note.err { background: var(--raised-strong); color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.prog { height: 6px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--hair); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.prog > div { height: 100%; background: var(--accent); transition: width .4s ease; }

/* The comments, as in the editor's Comments tab. */
.tabs { display: inline-flex; gap: 0; padding: 3px; background: var(--raised); border-radius: var(--r-md); box-shadow: 0 0 0 1px var(--hair-strong); flex: none !important; }
.tab { height: 30px; min-width: 64px; padding: 0 12px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500; color: var(--faint); transition: background-color .2s var(--ease), color .2s var(--ease); }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--raised-strong); color: var(--ink); box-shadow: var(--shadow-indicator); }
.pv .side > .row:first-child { justify-content: space-between; }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
.cm { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--raised); }
.cm.done { opacity: .5; }
.cm.editing { box-shadow: 0 0 0 1px var(--accent-ring); }
.cm .av { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.cm .av.client { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair-strong); }
.cm .who { font-size: 13px; line-height: 18px; min-width: 0; }
.cm .who b { font-weight: 600; }
.cm .who .muted { margin-left: 6px; font-size: 12px; }
.cm .acts { display: flex; gap: 2px; align-items: center; }
.cm .act, .act { height: 26px; padding: 0 8px; border-radius: var(--r-xs); color: var(--muted); font-size: 12px; font-weight: 500; }
.cm .act:hover, .act:hover { background: var(--raised-strong); color: var(--ink); }
.cm .act.warn { background: var(--ink); color: var(--bg); }
.cm .body { grid-column: 2 / -1; min-width: 0; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 20px; }
.cm .t { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-right: 6px; border-radius: var(--r-xs); background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .02em; vertical-align: 1px; font-variant-numeric: tabular-nums; }
.cm .t:hover { background: var(--accent); color: var(--on-accent); }
.cm .txt a, .compose a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
.cm .media { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.thumbimg { width: 64px; height: 48px; object-fit: cover; border-radius: var(--r-xs); box-shadow: 0 0 0 1px var(--hair-strong); cursor: zoom-in; background: var(--surface); display: block; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: var(--pill); font-size: 12px; font-weight: 500; background: var(--raised); color: var(--dim); box-shadow: 0 0 0 1px var(--hair-strong); }
.badge:hover { color: var(--ink); }
.cm .chk { width: 24px; height: 24px; border-radius: var(--r-xs); box-shadow: inset 0 0 0 1.5px var(--ghost); display: inline-flex; align-items: center; justify-content: center; padding: 0; font-size: 13px; margin-left: 4px; }
.cm .chk:hover { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cm.done .chk { background: var(--accent); color: var(--on-accent); box-shadow: none; }
/* The box to write a comment, as in the editor: the moment (lime), the words, Post. */
.compose { background: var(--raised); border-radius: var(--r-md); box-shadow: 0 0 0 1px var(--hair-strong); padding: 8px; transition: box-shadow .2s var(--ease); }
.compose:focus-within { box-shadow: 0 0 0 2px var(--accent-ring); }
.compose textarea { width: 100%; resize: vertical; min-height: 54px; max-height: 200px; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 4px 6px; outline: none; }
.compose.drop { box-shadow: 0 0 0 2px var(--accent); }
.editing-bar { font-size: 12px; color: var(--accent); padding: 0 4px 6px; }
.atts { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 4px 8px; }
.att { position: relative; }
.att canvas, .att img { width: 64px; height: 48px; object-fit: cover; border-radius: var(--r-xs); box-shadow: 0 0 0 1px var(--hair-strong); display: block; background: var(--surface); }
.att .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 11px; line-height: 18px; padding: 0; }
.at { height: 32px; padding: 0 10px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.at:hover { background: var(--accent); color: var(--on-accent); }
.compose .btn { height: 32px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + var(--ib, 0px)); transform: translateX(-50%); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-pop); padding: 8px 14px; border-radius: var(--r-md); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.on { opacity: 1; }
.skel { height: 180px; border-radius: var(--r-lg); background: linear-gradient(90deg, var(--raised), var(--raised-strong), var(--raised)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* Phones: one column, bigger targets, nothing wider than the screen. */
@media (max-width: 560px) {
  body, html.fs body { padding: calc(12px + var(--it, 0px)) calc(12px + var(--ir, 0px)) calc(12px + var(--ib, 0px)) calc(12px + var(--il, 0px)); }
  /* The box to write a comment goes right under the player (a phone's bottom is the host's chat box), and the page
     scrolls as a page, full screen too. */
  .pv .side > .compose { order: -1; }
  html.fs body { overflow: auto; }
  html.fs #root, html.fs .pv { height: auto; overflow: visible; }
  html.fs .pv .side { flex: none; }
  html.fs .pv .side > .list, html.fs .pv .side > .empty { flex: none; max-height: none; }
  h1 { font-size: 18px; line-height: 24px; }
  .top { gap: 6px; }
  .top .grow { flex-basis: calc(100% - 120px); }
  .search { max-width: none; }

      onDragleave: (e) => e.currentTarget.classList.remove("drop"),
      onDrop: (e) => { e.preventDefault(); e.currentTarget.classList.remove("drop"); addImages(e.dataTransfer && e.dataTransfer.files); } },
      c.editingId ? h("div", { class: "row editing-bar" }, h("span", { class: "grow" }, "Editing your comment at " + fmtTime(c.time || 0)), h("button", { class: "act", onClick: cancelEdit }, "Cancel")) : null,
      ta, atts.length ? h("div", { class: "atts" }, atts) : null,
      h("div", { class: "row" }, at,
        h("button", { class: "btn ghost step", title: "Add a picture (or paste or drop one)", disabled: c.images.length >= 4, onClick: () => file.click() }, "🖼 Picture"), file,
        h("span", { class: "grow muted small keyhint" }, navigator.platform.includes("Mac") ? "⌘ Enter" : "Ctrl Enter"), h("span", { class: "grow" }), add));

    const tabs = h("div", { class: "row" },
      h("div", { class: "tabs grow" },
        h("button", { class: "tab" + (state.filter === "open" ? " on" : ""), onClick: () => { state.filter = "open"; render(); } }, "Open " + open.length),
        h("button", { class: "tab" + (state.filter === "all" ? " on" : ""), onClick: () => { state.filter = "all"; render(); } }, "All " + v.comments.length)),
      h("button", { class: "btn primary", disabled: !open.length, title: open.length ? "Ask your AI to work through the open comments" : "No open comments", onClick: () => sendToAi(v, open) }, "Send to " + aiName()));

    const initial = (n) => ((n || "?").trim()[0] || "?").toUpperCase();
    const items = shown.map((x) => h("div", { class: "cm" + (x.resolved ? " done" : "") + (c.editingId === x.id ? " editing" : ""), "data-id": x.id },
      h("span", { class: "av" + (x.mine ? "" : " client"), "aria-hidden": "true" }, initial(x.author || "You")),
      h("span", { class: "who" }, h("b", {}, x.mine ? x.author || "You" : x.author + " (client)"), h("span", { class: "muted" }, ago(x.at) + (x.edited ? " · edited" : ""))),
      h("span", { class: "acts" },
        x.mine ? h("button", { class: "act", title: "Edit", onClick: () => startEdit(x) }, "Edit") : null,
        h("button", { class: "act" + (state.confirmDelete === x.id ? " warn" : ""), title: "Delete", onClick: () => askDelete(v, x) }, state.confirmDelete === x.id ? "Delete?" : "Delete"),
        h("button", { class: "chk", title: x.resolved ? "Open again" : "Resolve", "aria-label": x.resolved ? "Open again" : "Resolve", onClick: () => resolve(v, x) }, x.resolved ? "✓" : "")),
      h("div", { class: "body" }, h("button", { class: "t", title: "Go to " + fmtTime(x.time), onClick: () => look(x) }, fmtTime(x.time)), x.text ? h("span", { class: "txt" }, linkify(x.text)) : null),
      x.drawing || (x.images && x.images.length) ? h("div", { class: "media" },
        x.drawing ? h("button", { class: "badge", title: "Show the drawing on the picture", onClick: () => look(x) }, "✎ Drawing") : null,
        (x.images || []).map((im) => h("img", { class: "thumbimg", src: im.url, alt: im.name || "Picture", title: im.name || "Picture", onClick: () => { state.lightbox = im.url; render(); } }))) : null));
    const list = items.length ? h("div", { class: "list", "data-key": "comments" }, items) : h("div", { class: "empty", style: "padding:18px" }, state.filter === "open" && v.comments.length ? "Every comment is resolved." : "No comments yet. Play the preview, pause where something should change, and write it here.");
    return h("div", { class: "side" }, tabs, list, compose);
  }

  function startEdit(x) {
    state.compose = { editingId: x.id, time: x.time, drawing: x.drawing ? { w: x.drawing.w, h: x.drawing.h, strokes: x.drawing.strokes.map((st) => ({ c: st.c, w: st.w, p: st.p.slice() })) } : null, drawingChanged: false,
      images: (x.images || []).map((im) => ({ existing: true, id: im.id, url: im.url, name: im.name })), removeImages: [] };
    state.draft = x.text; state.drawMode = false; state.viewDrawing = null;
    seek(x.time); if (player) player.pause();
    render();
    const ta = document.querySelector('[data-key="draft"]'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  function cancelEdit() { state.compose = freshCompose(); state.draft = ""; state.drawMode = false; render(); }
  let deleteTimer = null;
  async function askDelete(v, x) {
    if (state.confirmDelete !== x.id) { state.confirmDelete = x.id; clearTimeout(deleteTimer); deleteTimer = setTimeout(() => { state.confirmDelete = null; render(); }, 3000); render(); return; }
    state.confirmDelete = null; clearTimeout(deleteTimer);
    try {
      const nv = await callTool("app_delete_comment", { projectId: v.project.id, commentId: x.id });
      if (state.compose.editingId === x.id) { state.compose = freshCompose(); state.draft = ""; }
      tellModel("In the Rendrr app the user deleted the comment at " + fmtTime(x.time) + " on \"" + v.project.name + "\": " + (x.text || "(no words)"));
      toast("Comment deleted.");
      if (nv) showProject(nv);
    } catch (e) { toast(e.message); }
  }

  async function resolve(v, c) {
    try { const nv = await callTool("app_resolve_comment", { projectId: v.project.id, commentId: c.id, resolved: !c.resolved }); if (nv) showProject(nv); }
    catch (e) { toast(e.message); }
  }

  async function renderPreview() {
    if (!state.project) return;
    state.busy = true; render();
    try { const nv = await callTool("app_render_preview", { projectId: state.project.project.id }); state.busy = false; if (nv) showProject(nv); }
    catch (e) { state.busy = false; render(); toast(e.message); }
  }

  async function sendToAi(v, open) {
    const carries = (c) => { const w = [c.drawing ? "drawing" : "", c.images && c.images.length ? c.images.length + (c.images.length === 1 ? " picture" : " pictures") : ""].filter(Boolean); return w.length ? " (" + w.join(", ") + ")" : ""; };
    const lines = open.slice(0, 30).map((c) => "- " + fmtTime(c.time) + " " + (c.text || "(no words)").replace(/\s+/g, " ").slice(0, 300) + carries(c));
    const media = open.some((c) => c.drawing || (c.images && c.images.length));
    const text = "Please work through the " + open.length + " open " + (open.length === 1 ? "comment" : "comments") + " on my Rendrr edit \"" + v.project.name + "\" (project " + v.project.id + ")" + (v.preview ? ", made on preview v" + v.preview.version : "") + ":\n" + lines.join("\n") +
      "\n\nRead them with get_comments" + (media ? " (images true shows the drawings and pictures)" : "") + ", fix each one and the same kind of mistake everywhere in one apply_edits, check it with check_edit, render one preview, then resolve the comments you fixed.";
    try { const r = await sendMessage(text); if (r && r.isError) throw new Error(); toast("Sent to " + aiName() + "."); }
    catch { toast("Could not send it. Copy the comments into the chat instead."); }
  }

  document.addEventListener("keydown", (e) => {
    if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
    if (e.key === "Escape" && state.lightbox) { state.lightbox = null; render(); return; }
    if (e.key === "Escape" && state.drawMode) { endDraw(); return; }
    if (e.key === " " && e.target && e.target.tagName === "BUTTON") return; // the button's own click does it
    if (e.key === " " && player) { e.preventDefault(); togglePlay(); }
    else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && player) { e.preventDefault(); step((e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 1 : 0.1)); }
  });

  // ---------------- start ----------------
  // ChatGPT's context in the standard shape: display mode, safe area, phone or desktop.
  const openaiContext = () => {
    const g = oa() || {}, ins = (g.safeArea && g.safeArea.insets) || null, device = g.userAgent && g.userAgent.device && g.userAgent.device.type;
    return { displayMode: g.displayMode === "fullscreen" ? "fullscreen" : "inline", availableDisplayModes: ["inline", "fullscreen"], ...(ins ? { safeAreaInsets: ins } : {}), ...(device ? { platform: device === "mobile" ? "mobile" : "desktop" } : {}) };
  };
  function useOpenAI() {
    viaOpenAI = true;
    host.info = { name: "ChatGPT" };
    applyContext(openaiContext());
    // What open_projects asked for and returned, as ChatGPT gives them; and their changes.
    const g = oa();
    if (g.toolInput) onToolInput(g.toolInput);
    if (g.toolOutput) onToolResult({ structuredContent: g.toolOutput });
    window.addEventListener("openai:set_globals", (e) => {
      const gl = (e && e.detail && e.detail.globals) || {};
      if ("displayMode" in gl || "safeArea" in gl) applyContext(openaiContext());
      if (gl.toolOutput) onToolResult({ structuredContent: gl.toolOutput });
    });
    lastH = 0; sizeNow();
  }
  (async () => {
    try {
      // In ChatGPT the standard bridge is tried briefly first: ChatGPT speaks it too, and then nothing changes.
      const r = await request("ui/initialize", { appInfo: { name: "rendrr-projects", version: "1.0.0" }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] }, protocolVersion: PROTOCOL }, oa() ? 2500 : 15000);
      host.caps = (r && r.hostCapabilities) || {};
      host.info = (r && r.hostInfo) || null;
      applyContext((r && r.hostContext) || {});
      notify("ui/notifications/initialized", {});
    } catch {
      if (oa()) useOpenAI(); /* else an old host: carry on, the tools may still work */
    }
    // The host sends open_projects' result; if it does not come, ask for the list (or the edit) directly.
    setTimeout(() => { if (!state.page && !state.project) { if (wantedId) openProject(wantedId); loadList(); } }, 2500);
  })();
})();
</script>
</body>
</html>
