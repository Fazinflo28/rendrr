# Builds Rendrr for Mac (desktop/) on a Mac, checks it opens and loads Rendrr, and publishes the installers
# (Apple Silicon and Intel .dmg) as a GitHub Release. Runs when desktop/ changes, or by hand.
name: Mac app

on:
  push:
    branches: [claude/rendrr-backend-mcp-1vbkgg, main]
    paths: ["desktop/**", ".github/workflows/desktop-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # GitHub's sign-in token, which Rendrr's API checks before it takes the installers

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test the link rules
        run: npm test

      - name: Set the version (0.1.<build number>)
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Build the Apple Silicon and Intel apps
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Check the apps
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Rendrr.app
          codesign -dv dist/mac-arm64/Rendrr.app 2>&1 | grep -E "Identifier|Format|Signature"
          echo "Apple Silicon: $(lipo -archs dist/mac-arm64/Rendrr.app/Contents/MacOS/Rendrr)"
          echo "Intel: $(lipo -archs dist/mac/Rendrr.app/Contents/MacOS/Rendrr)"

      - name: Open the app and load Rendrr
        run: |
          OUT="$RUNNER_TEMP/smoke.json"
          ( sleep 150; pkill -f "Rendrr.app/Contents/MacOS/Rendrr" ) &
          RENDRR_SMOKE_OUT="$OUT" dist/mac-arm64/Rendrr.app/Contents/MacOS/Rendrr || true
          cat "$OUT"
          node -e "const r = require(process.argv[1]); if (!r.ok) { console.error('The app did not load Rendrr properly'); process.exit(1); }" "$OUT"

      - name: Name the installers
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "dist/Rendrr-$V-arm64.dmg" out/Rendrr-Mac-AppleSilicon.dmg
          cp "dist/Rendrr-$V-x64.dmg" out/Rendrr-Mac-Intel.dmg
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Rendrr-Mac
          path: desktop/out/*.dmg
          retention-days: 30

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "mac-v$V" out/Rendrr-Mac-AppleSilicon.dmg out/Rendrr-Mac-Intel.dmg \
            --target "$GITHUB_SHA" --title "Rendrr for Mac $V" --notes-file RELEASE_NOTES.md --latest

      # The public download link (api.rendrr.live/download/mac, app.rendrr.live/download): the installers go to
      # Rendrr's storage, signed in with this workflow's GitHub OIDC token (no stored secret). A fresh token for
      # each file; the API may still be deploying, so each upload is tried a few times.
      - name: Put the installers on Rendrr's download link
        run: |
          V=$(node -p "require('./package.json').version")
          for pair in apple:Rendrr-Mac-AppleSilicon.dmg intel:Rendrr-Mac-Intel.dmg; do
            chip=${pair%%:*}; file=${pair#*:}
            for try in 1 2 3 4 5 6; do
              TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rendrr-downloads" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).value")
              if curl -fsS --max-time 900 -X PUT -H "Authorization: Bearer $TOKEN" -H "content-type: application/octet-stream" -T "out/$file" "https://api.rendrr.live/download/mac/$chip?version=$V"; then echo; break; fi
              if [ "$try" = 6 ]; then echo "Could not put $file on the download link"; exit 1; fi
              echo "Upload of $file failed (try $try), trying again in 60 s"; sleep 60
            done
          done
          echo "Download page: https://app.rendrr.live/download"
